name: Upstream CLI and ACP metadata
on:
  workflow_dispatch:
  schedule:
    - cron: '20 2 * * 1'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare official public metadata
        run: node scripts/check-upstream.cjs --output upstream-report.json
      - name: Preserve maintenance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-metadata-report
          path: upstream-report.json
          if-no-files-found: ignore
