name: Publish Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run lint:electron
      - run: npm run typecheck:electron
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - name: Build installers
        run: npx electron-builder --win nsis portable --x64 --publish never
      - name: Test packaged desktop tools
        shell: pwsh
        run: |
          $env:GROK_DESKTOP_TEST_EXE = (Resolve-Path "release/win-unpacked/Grok Desktop.exe").Path
          node scripts/verify-packaged-fuses.cjs $env:GROK_DESKTOP_TEST_EXE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/terminal-native.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:e2e:upgrades
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/e2e-review-fixes.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/e2e-access.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/e2e-draft-force-exit.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/e2e-usability.cjs
      - name: Publish release
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $assets = @(
            "release/Grok-Desktop-$version-Setup.exe",
            "release/Grok-Desktop-$version-Setup.exe.blockmap",
            "release/Grok-Desktop-$version-Windows.exe",
            "release/latest.yml"
          )
          if (gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY 2>$null) {
            gh release upload $env:GITHUB_REF_NAME $assets --clobber --repo $env:GITHUB_REPOSITORY
            gh release edit $env:GITHUB_REF_NAME --latest --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $env:GITHUB_REF_NAME $assets --title "Grok Desktop $version" --generate-notes --latest --repo $env:GITHUB_REPOSITORY
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
